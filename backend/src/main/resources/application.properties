spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/space_reservation}
spring.datasource.username=${DB_USERNAME:space_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60
app.admin.email=${ADMIN_EMAIL:}
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.business-zone=Asia/Seoul
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
